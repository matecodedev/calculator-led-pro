[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The service worker must never be served from a cache. If it is, an installed
# app keeps running an old build forever and never learns a new one exists —
# which for an offline-first tool means a technician in a venue is using
# whatever version they installed months ago.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Vite fingerprints these, so the filename changes whenever the bytes do.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts keep stable names, so they get a long life but stay revalidatable. The
# service worker precaches them with a revision hash and handles updates.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Single page: anything else resolves to the shell rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
